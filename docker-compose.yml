services:
  db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: django_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: django_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U django_user -d django_db']
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             if [ \"$$DJANGO_ENV\" = \"production\" ]; then 
               python manage.py collectstatic --noinput &&
               gunicorn listening_journal.wsgi:application -c gunicorn.conf.py;
             else 
               python manage.py runserver 0.0.0.0:8000; 
             fi"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: listening_journal.settings.development
      SECRET_KEY: ${SECRET_KEY:-django-insecure-development-only-secret-key}
      DEBUG: ${DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      POSTGRES_DB: django_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: django_pass
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-local-access-key}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-local-secret-key}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-http://localhost:9000}
      R2_PRIVATE_BUCKET_NAME: ${R2_PRIVATE_BUCKET_NAME:-private-media}
      DJANGO_ENV: ${DJANGO_ENV:-development}

  worker:
    build: .
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py wait_for_migrations &&
             python manage.py procrastinate worker --queues=email,exports,maintenance"
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: listening_journal.settings.development
      SECRET_KEY: ${SECRET_KEY:-django-insecure-development-only-secret-key}
      DEBUG: ${DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      POSTGRES_DB: django_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: django_pass
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-local-access-key}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-local-secret-key}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-http://localhost:9000}
      R2_PRIVATE_BUCKET_NAME: ${R2_PRIVATE_BUCKET_NAME:-private-media}
    user: django

volumes:
  postgres_data:
  static_volume:
