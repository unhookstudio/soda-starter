[project]
name = "soda-starter"
version = "0.2.0"
description = "Somewhat Opinionated Django API Starter"
requires-python = ">=3.14,<3.15"
dependencies = [
    "boto3==1.43.123",
    "django==6.0.8",
    "django-cors-headers==4.9.0",
    "django-csp==4.0",
    "django-environ==0.14.0",
    "django-ninja==1.7.3",
    "django-ninja-extra==0.31.7",
    "django-ninja-jwt==5.4.4",
    "django-storages==1.14.6",
    "gunicorn==26.2.0",
    "orjson==3.13.0",
    "pillow==12.3.0",
    "procrastinate[django]==3.10.0",
    "pydantic==2.14.2",
    "python-multipart==0.0.32",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "django-stubs==6.1.2",
    "factory-boy==3.3.3",
    "flake8==7.5.0",
    "isort==8.0.1",
    "mypy==2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-django==4.14.0",
]

[tool.uv]
package = false
