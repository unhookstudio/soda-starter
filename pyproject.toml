[project]
name = "soda-starter"
version = "0.1.0"
description = "Somewhat Opinionated Django API Starter"
requires-python = ">=3.14,<3.15"
dependencies = [
    "boto3==1.43.64",
    "django==6.0.8",
    "django-cors-headers==4.9.0",
    "django-csp==4.0",
    "django-environ==0.14.0",
    "django-ninja==1.6.2",
    "django-ninja-extra==0.31.6",
    "django-ninja-jwt==5.4.4",
    "django-storages==1.14.6",
    "gunicorn==26.0.0",
    "orjson==3.11.9",
    "pillow==12.3.0",
    "procrastinate[django]==3.9.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "django-stubs==6.0.7",
    "factory-boy==3.3.3",
    "flake8==7.3.0",
    "isort==8.0.1",
    "mypy==2.3.0",
    "pip-audit>=2.10.1",
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-django==4.12.0",
]

[tool.uv]
package = false
